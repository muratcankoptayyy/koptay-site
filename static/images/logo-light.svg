<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Light version for dark backgrounds -->
  <defs>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.95);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.85);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(58,118,121);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(38,90,93);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#lightGradient)"/>
  
  <!-- Inner Circle Border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(48,105,108,0.2)" stroke-width="2"/>
  
  <!-- Scale of Justice -->
  <rect x="95" y="140" width="10" height="35" rx="2" fill="url(#accentLight)"/>
  <ellipse cx="100" cy="175" rx="25" ry="5" fill="url(#accentLight)" opacity="0.8"/>
  
  <rect x="97" y="60" width="6" height="85" rx="3" fill="url(#accentLight)"/>
  <rect x="50" y="58" width="100" height="6" rx="3" fill="url(#accentLight)"/>
  
  <!-- Left Scale -->
  <g>
    <line x1="65" y1="61" x2="65" y2="85" stroke="rgb(48,105,108)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="65" cy="85" rx="18" ry="4" fill="rgb(48,105,108)"/>
    <path d="M 47 85 Q 47 95, 65 97 Q 83 95, 83 85" fill="rgba(48,105,108,0.8)" stroke="rgb(48,105,108)" stroke-width="1.5"/>
  </g>
  
  <!-- Right Scale -->
  <g>
    <line x1="135" y1="61" x2="135" y2="85" stroke="rgb(48,105,108)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="135" cy="85" rx="18" ry="4" fill="rgb(48,105,108)"/>
    <path d="M 117 85 Q 117 95, 135 97 Q 153 95, 153 85" fill="rgba(48,105,108,0.8)" stroke="rgb(48,105,108)" stroke-width="1.5"/>
  </g>
  
  <!-- Top Ornament -->
  <circle cx="100" cy="58" r="8" fill="rgb(48,105,108)"/>
  <circle cx="100" cy="58" r="5" fill="white"/>
  
  <!-- Law Book -->
  <g transform="translate(60, 105)">
    <rect x="0" y="0" width="16" height="20" rx="2" fill="rgb(48,105,108)"/>
    <line x1="3" y1="6" x2="13" y2="6" stroke="white" stroke-width="1.5"/>
    <line x1="3" y1="10" x2="13" y2="10" stroke="white" stroke-width="1.5"/>
    <line x1="3" y1="14" x2="10" y2="14" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- Gavel -->
  <g transform="translate(124, 105)">
    <rect x="0" y="8" width="18" height="6" rx="2" fill="rgb(48,105,108)"/>
    <rect x="6" y="14" width="6" height="12" rx="2" fill="rgb(48,105,108)"/>
    <circle cx="9" cy="6" r="4" fill="rgb(48,105,108)"/>
  </g>
</svg>
