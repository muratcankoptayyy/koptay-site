# Fly.io Configuration - Ulusal Tevkil Ağı Projesi
# https://fly.io/docs/reference/configuration/

app = "tevkil"
primary_region = "ist"  # Istanbul region (en hızlı Türkiye için)

[build]
  # Buildpacks kullanarak otomatik build
  # Python + Flask + PostgreSQL + Redis
  
[env]
  PORT = "8080"
  FLASK_ENV = "production"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Sürekli çalışsın (FREE tier için önemli)
  auto_start_machines = true
  min_machines_running = 1
  
  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"  # FREE tier (2 GB'a kadar ücretsiz)
  cpu_kind = "shared"
  cpus = 1

# Health check - Uygulama sağlıklı mı?
[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

# PostgreSQL Database (Fly.io otomatik sağlar)
# fly postgres create --name tevkil-db --region ist

# Redis Cache (Fly.io otomatik sağlar)
# fly redis create --name tevkil-redis --region ist
