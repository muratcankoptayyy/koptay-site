<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Modern Icon - Connected Network -->
  <g transform="translate(20, 40)">
    <!-- Main hexagon -->
    <path d="M 60,20 L 90,35 L 90,65 L 60,80 L 30,65 L 30,35 Z" fill="url(#grad1)" stroke="none"/>
    
    <!-- Inner scale symbol -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="60" y1="35" x2="60" y2="55"/>
      <line x1="45" y1="50" x2="75" y2="50"/>
      <circle cx="45" cy="65" r="4" fill="#FFFFFF"/>
      <circle cx="75" cy="65" r="4" fill="#FFFFFF"/>
      <line x1="45" y1="50" x2="45" y2="65"/>
      <line x1="75" y1="50" x2="75" y2="65"/>
    </g>
    
    <!-- Network connections -->
    <g stroke="url(#grad2)" stroke-width="2.5" fill="url(#grad2)">
      <line x1="60" y1="20" x2="60" y2="5" opacity="0.8"/>
      <circle cx="60" cy="5" r="3.5"/>
      
      <line x1="90" y1="35" x2="105" y2="25" opacity="0.8"/>
      <circle cx="105" cy="25" r="3.5"/>
      
      <line x1="90" y1="65" x2="105" y2="75" opacity="0.8"/>
      <circle cx="105" cy="75" r="3.5"/>
      
      <line x1="30" y1="35" x2="15" y2="25" opacity="0.8"/>
      <circle cx="15" cy="25" r="3.5"/>
      
      <line x1="30" y1="65" x2="15" y2="75" opacity="0.8"/>
      <circle cx="15" cy="75" r="3.5"/>
    </g>
  </g>
  
  <!-- Modern Typography -->
  <g transform="translate(140, 50)">
    <!-- UTAP -->
    <text x="0" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="url(#grad1)" letter-spacing="-1">
      UTAP
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" letter-spacing="2">
      ULUSAL TEVKİL AĞI PROJESİ
    </text>
    
    <!-- Tagline -->
    <text x="0" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" letter-spacing="0.5">
      Avukatlar için Güvenilir Tevkil Platformu
    </text>
  </g>
</svg>
