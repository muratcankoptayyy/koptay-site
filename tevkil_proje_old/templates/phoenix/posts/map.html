{% extends "base.html" %}

{% block title %}Harita - Ulusal Tevkil Ağı Projesi{% endblock %}

{% block content %}
<div class="flex flex-col h-screen">
    <!-- Phoenix Header -->
    <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 p-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-brand-100 dark:bg-brand-900/30">
                    <span class="material-symbols-outlined text-brand-600 dark:text-brand-400 text-2xl">map</span>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white">İlan Haritası</h1>
                    <p class="text-sm text-slate-600 dark:text-slate-400">{{ posts|length }} ilan haritada gösteriliyor</p>
                </div>
            </div>
            
            <!-- View Toggle -->
            <div class="flex gap-2">
                <a href="{{ url_for('list_posts') }}" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all rounded-lg flex items-center gap-2 font-medium">
                    <span class="material-symbols-outlined text-lg">view_list</span>
                    <span class="hidden sm:inline">Liste</span>
                </a>
                <button class="px-4 py-2 bg-brand-600 text-white rounded-lg flex items-center gap-2 font-medium shadow-sm">
                    <span class="material-symbols-outlined text-lg">map</span>
                    <span class="hidden sm:inline">Harita</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div class="flex-1 relative">
        <div id="map" class="w-full h-full"></div>
        
        <!-- Loading Indicator - Phoenix Style -->
        <div id="mapLoading" class="absolute inset-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-sm flex items-center justify-center z-10">
            <div class="text-center">
                <div class="animate-spin rounded-full h-14 w-14 border-4 border-brand-200 border-t-brand-600 mx-auto mb-4"></div>
                <p class="text-slate-600 dark:text-slate-400 font-medium">Harita yükleniyor...</p>
            </div>
        </div>
    </div>
</div>

<!-- Google Maps API -->
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&callback=initMap&libraries=places&language=tr&region=TR" async defer></script>

<script>
let map;
let markers = [];
let infoWindow;

// İlan verileri
const posts = {{ posts_json | safe }};

function initMap() {
    console.log('🗺️ Harita başlatılıyor...', posts.length, 'ilan');
    
    // Hide loading
    document.getElementById('mapLoading').style.display = 'none';
    
    // Türkiye merkezi
    const center = { lat: 39.9334, lng: 32.8597 };
    
    // Phoenix-themed map styles
    const isDark = document.documentElement.classList.contains('dark');
    const mapStyles = isDark ? [
        { elementType: 'geometry', stylers: [{ color: '#1e293b' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#0f172a' }] },
        { elementType: 'labels.text.fill', stylers: [{ color: '#94a3b8' }] },
        {
            featureType: 'administrative',
            elementType: 'geometry.stroke',
            stylers: [{ color: '#334155' }]
        },
        {
            featureType: 'poi',
            elementType: 'labels',
            stylers: [{ visibility: 'off' }]
        },
        {
            featureType: 'road',
            elementType: 'geometry',
            stylers: [{ color: '#334155' }]
        },
        {
            featureType: 'road',
            elementType: 'geometry.stroke',
            stylers: [{ color: '#1e293b' }]
        },
        {
            featureType: 'water',
            elementType: 'geometry',
            stylers: [{ color: '#0f172a' }]
        }
    ] : [
        {
            featureType: 'poi',
            elementType: 'labels',
            stylers: [{ visibility: 'off' }]
        }
    ];
    
    // Map options
    map = new google.maps.Map(document.getElementById('map'), {
        zoom: 6,
        center: center,
        mapTypeControl: true,
        streetViewControl: false,
        fullscreenControl: true,
        zoomControl: true,
        styles: mapStyles
    });
    
    // Info window
    infoWindow = new google.maps.InfoWindow();
    
    // Bounds for auto-fit
    const bounds = new google.maps.LatLngBounds();
    
    // Add markers
    posts.forEach(post => {
        if (!post.latitude || !post.longitude) {
            console.warn('Koordinat yok:', post.id, post.title);
            return;
        }
        
        const position = { lat: post.latitude, lng: post.longitude };
        
        // Phoenix brand colors for urgency
        let markerColor = '#6366f1'; // brand-600 (normal)
        if (post.urgency_level === 'urgent') {
            markerColor = '#f59e0b'; // amber-500
        } else if (post.urgency_level === 'very_urgent') {
            markerColor = '#ef4444'; // red-500
        }
        
        // Custom marker icon
        const markerIcon = {
            path: google.maps.SymbolPath.CIRCLE,
            fillColor: markerColor,
            fillOpacity: 0.9,
            strokeColor: '#ffffff',
            strokeWeight: 2,
            scale: 10
        };
        
        const marker = new google.maps.Marker({
            position: position,
            map: map,
            title: post.title,
            icon: markerIcon,
            animation: google.maps.Animation.DROP
        });
        
        // Info window content - Phoenix styled
        const urgencyBadge = post.urgency_level === 'very_urgent' ? 
            '<span style="display: inline-block; padding: 4px 10px; background: #fef2f2; color: #dc2626; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">Çok Acil</span>' :
            post.urgency_level === 'urgent' ?
            '<span style="display: inline-block; padding: 4px 10px; background: #fffbeb; color: #d97706; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">Acil</span>' :
            '';
        
        const contentString = `
            <div style="max-width: 320px; font-family: 'Inter', sans-serif;">
                <div style="background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 16px; margin: -12px -12px 12px -12px; border-radius: 10px 10px 0 0;">
                    <h3 style="color: white; margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4;">${post.title}</h3>
                </div>
                
                <div style="padding: 0 4px;">
                    ${urgencyBadge}
                    
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #64748b;">
                        <span class="material-symbols-outlined" style="font-size: 18px; color: #6366f1;">location_on</span>
                        <span style="font-size: 14px; font-weight: 500;">${post.city} - ${post.courthouse}</span>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #64748b;">
                        <span class="material-symbols-outlined" style="font-size: 18px; color: #6366f1;">work</span>
                        <span style="font-size: 14px; font-weight: 500;">${post.category}</span>
                    </div>
                    
                    ${post.court_date ? `
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: #64748b;">
                        <span class="material-symbols-outlined" style="font-size: 18px; color: #6366f1;">event</span>
                        <span style="font-size: 14px; font-weight: 500;">${post.court_date}</span>
                    </div>
                    ` : ''}
                    
                    ${post.price_display ? `
                    <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 8px; margin-bottom: 12px;">
                        <div style="display: flex; align-items: center; gap: 8px; color: #16a34a;">
                            <span class="material-symbols-outlined" style="font-size: 18px;">payments</span>
                            <span style="font-size: 15px; font-weight: 700;">${post.price_display}</span>
                        </div>
                    </div>
                    ` : ''}
                    
                    <a href="/posts/${post.id}" 
                       style="display: inline-block; width: 100%; text-align: center; background: #6366f1; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s; box-shadow: 0 1px 3px rgba(99, 102, 241, 0.2);"
                       onmouseover="this.style.background='#4f46e5'; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 6px rgba(99, 102, 241, 0.3)'"
                       onmouseout="this.style.background='#6366f1'; this.style.transform='translateY(0)'; this.style.boxShadow='0 1px 3px rgba(99, 102, 241, 0.2)'">
                        İlanı Görüntüle →
                    </a>
                </div>
            </div>
        `;
        
        marker.addListener('click', () => {
            infoWindow.setContent(contentString);
            infoWindow.open(map, marker);
        });
        
        markers.push(marker);
        bounds.extend(position);
    });
    
    // Fit map to markers
    if (markers.length > 0) {
        map.fitBounds(bounds);
        
        // Don't zoom in too much for single markers
        google.maps.event.addListenerOnce(map, 'bounds_changed', function() {
            if (markers.length === 1) {
                this.setZoom(Math.min(14, this.getZoom()));
            }
        });
    }
    
    console.log('✅ Harita yüklendi!', markers.length, 'marker eklendi');
}

// Error handler - Phoenix styled
window.gm_authFailure = function() {
    document.getElementById('mapLoading').innerHTML = `
        <div class="text-center p-8">
            <div class="flex items-center justify-center w-20 h-20 rounded-2xl bg-red-100 dark:bg-red-900/30 mx-auto mb-4">
                <span class="material-symbols-outlined text-red-600 dark:text-red-400 text-5xl">error</span>
            </div>
            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Harita Yüklenemedi</h3>
            <p class="text-slate-600 dark:text-slate-400">Google Maps API anahtarı gerekli</p>
        </div>
    `;
};
</script>
{% endblock %}
