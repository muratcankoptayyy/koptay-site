{% extends "base.html" %}
{% block title %}Sunucu Hatası - 500{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-12 bg-slate-50 dark:bg-slate-900">
    <div class="text-center max-w-lg">
        <div class="mb-8">
            <span class="material-symbols-outlined text-red-600 dark:text-red-400" style="font-size: 120px;">error</span>
        </div>
        <h1 class="text-6xl font-bold text-slate-900 dark:text-white mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-slate-700 dark:text-slate-300 mb-4">Sunucu Hatası</h2>
        <p class="text-slate-600 dark:text-slate-400 mb-8">Bir hata oluştu. Lütfen daha sonra tekrar deneyin.</p>
        {% if error %}
        <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 rounded-xl p-4 mb-6 text-left">
            <p class="text-sm text-red-800 dark:text-red-200 font-mono">{{ error }}</p>
        </div>
        {% endif %}
        <div class="flex gap-3 justify-center">
            <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 text-white font-semibold rounded-xl hover:bg-brand-700 transition-all shadow-sm">
                <span class="material-symbols-outlined">home</span>
                Ana Sayfa
            </a>
            <a href="{{ url_for('contact') }}" class="inline-flex items-center gap-2 px-6 py-3 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-white font-semibold rounded-xl hover:bg-slate-300 dark:hover:bg-slate-600 transition-all">
                <span class="material-symbols-outlined">support</span>
                Destek
            </a>
        </div>
    </div>
</div>
{% endblock %}
