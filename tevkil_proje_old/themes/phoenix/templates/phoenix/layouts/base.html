<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tevkil Phoenix{% endblock %}</title>
    <meta name="description" content="Tevkil Platformu için yenilenmiş Phoenix arayüzü">
    <link rel="icon" href="{{ url_for('phoenix_static', filename='img/favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('phoenix_static', filename='css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="min-h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100" x-data="{ mobileNav: false, darkMode: localStorage.theme === 'dark' }" x-bind:class="{ 'dark': darkMode }">
    <div class="flex min-h-full flex-col">
        {% include 'phoenix/components/top_bar.html' %}
        {% block body %}
        <main class="flex-1">
            {% block content %}{% endblock %}
        </main>
        {% endblock %}
        {% include 'phoenix/components/footer.html' %}
    </div>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="{{ url_for('phoenix_static', filename='js/interactivity.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
