<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur dark:border-slate-800/80 dark:bg-slate-900/90">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
            <button class="rounded-xl border border-slate-200 p-2 text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 md:hidden"
                    @click="mobileNav = !mobileNav" aria-label="Mobil menüyü aç">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <a href="{{ url_for('phoenix.home') }}" class="flex items-center gap-2">
                <img src="{{ url_for('static', filename='logo-icon.svg') }}" alt="UTAP logosu" class="h-10 w-10 rounded-xl bg-brand-600/5 p-1.5 shadow-soft">
                <div class="hidden flex-col leading-none sm:flex">
                    <span class="font-heading text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Ulusal Tevkil Ağı</span>
                    <span class="text-xs font-medium uppercase text-brand-500">UTAP Önizleme</span>
                </div>
            </a>
        </div>
        <nav class="hidden items-center gap-8 text-sm font-medium text-slate-600 md:flex">
            <a href="{{ url_for('phoenix.home') }}" class="transition hover:text-brand-600 {% if request.endpoint == 'phoenix.home' %}text-brand-600{% endif %}">Ana Sayfa</a>
            <a href="{{ url_for('phoenix.dashboard_overview') }}" class="transition hover:text-brand-600 {% if 'dashboard' in (request.endpoint or '') %}text-brand-600{% endif %}">Panel</a>
            <a href="{{ url_for('phoenix.posts_explore') }}" class="transition hover:text-brand-600 {% if request.endpoint == 'phoenix.posts_explore' %}text-brand-600{% endif %}">İlanlar</a>
            <a href="{{ url_for('phoenix.messages_center') }}" class="transition hover:text-brand-600 {% if request.endpoint == 'phoenix.messages_center' %}text-brand-600{% endif %}">Mesajlar</a>
            <a href="{{ url_for('phoenix.admin_overview') }}" class="transition hover:text-brand-600 {% if 'admin' in (request.endpoint or '') %}text-brand-600{% endif %}">Admin</a>
        </nav>
        <div class="flex items-center gap-3">
            <button @click="darkMode = !darkMode; localStorage.theme = darkMode ? 'dark' : 'light'"
                    class="hidden rounded-full border border-slate-200 p-2 text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 md:inline-flex"
                    aria-label="Tema değiştir">
                <svg x-show="!darkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1.5M12 19.5V21M4.22 4.22l1.06 1.06M18.72 18.72l1.06 1.06M3 12h1.5M19.5 12H21M4.22 19.78l1.06-1.06M18.72 5.28l1.06-1.06M12 6.75A5.25 5.25 0 1 1 6.75 12 5.25 5.25 0 0 1 12 6.75z" />
                </svg>
                <svg x-show="darkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <a href="{{ url_for('phoenix.auth_login') }}" class="hidden text-sm font-semibold text-slate-600 transition hover:text-brand-600 md:inline-flex">Giriş Yap</a>
            <a href="{{ url_for('phoenix.auth_register') }}" class="btn btn-primary hidden md:inline-flex">Kayıt Ol</a>
            <div class="relative inline-flex md:hidden">
                <button class="rounded-full border border-slate-200 p-2 text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
                        @click="darkMode = !darkMode; localStorage.theme = darkMode ? 'dark' : 'light'">
                    <svg x-show="!darkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1.5M12 19.5V21M4.22 4.22l1.06 1.06M18.72 18.72l1.06 1.06M3 12h1.5M19.5 12H21M4.22 19.78l1.06-1.06M18.72 5.28l1.06-1.06M12 6.75A5.25 5.25 0 1 1 6.75 12 5.25 5.25 0 0 1 12 6.75z" />
                    </svg>
                    <svg x-show="darkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div class="md:hidden" x-show="mobileNav" x-transition>
        <div class="space-y-1 border-t border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-600 dark:border-slate-800 dark:bg-slate-900">
            <a href="{{ url_for('phoenix.home') }}" class="block rounded-lg px-3 py-2 transition hover:bg-slate-100 {% if request.endpoint == 'phoenix.home' %}bg-slate-100 text-brand-600{% endif %}">Ana Sayfa</a>
            <a href="{{ url_for('phoenix.dashboard_overview') }}" class="block rounded-lg px-3 py-2 transition hover:bg-slate-100 {% if 'dashboard' in (request.endpoint or '') %}bg-slate-100 text-brand-600{% endif %}">Panel</a>
            <a href="{{ url_for('phoenix.posts_explore') }}" class="block rounded-lg px-3 py-2 transition hover:bg-slate-100 {% if request.endpoint == 'phoenix.posts_explore' %}bg-slate-100 text-brand-600{% endif %}">İlanlar</a>
            <a href="{{ url_for('phoenix.messages_center') }}" class="block rounded-lg px-3 py-2 transition hover:bg-slate-100 {% if request.endpoint == 'phoenix.messages_center' %}bg-slate-100 text-brand-600{% endif %}">Mesajlar</a>
            <a href="{{ url_for('phoenix.admin_overview') }}" class="block rounded-lg px-3 py-2 transition hover:bg-slate-100 {% if 'admin' in (request.endpoint or '') %}bg-slate-100 text-brand-600{% endif %}">Admin</a>
            <div class="pt-3">
                <a href="{{ url_for('phoenix.auth_login') }}" class="block rounded-lg px-3 py-2 text-slate-600 transition hover:bg-slate-100">Giriş Yap</a>
                <a href="{{ url_for('phoenix.auth_register') }}" class="mt-2 flex items-center justify-center rounded-lg bg-brand-600 px-3 py-2 font-semibold text-white transition hover:bg-brand-700">Kayıt Ol</a>
            </div>
        </div>
    </div>
</header>
