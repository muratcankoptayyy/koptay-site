<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Tevkil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body class="bg-white">
    
    <div class="min-h-screen flex">
        <!-- Left Side - Form -->
                <!-- Left Side - Login Form -->
        <div class="w-1/2 p-24 flex items-center justify-center border-r border-gray-300">
            <div class="w-full max-w-md">
                <div class="mb-16">
                    <a href="index_minimal.html" class="text-2xl font-light text-gray-900">Tevkil</a>
                </div>
                
                <h1 class="text-4xl font-light text-gray-900 mb-3">Giriş Yap</h1>
                <p class="text-gray-500 mb-12">Hesabınıza erişin</p>
                
                <form class="space-y-8">
                    <div>
                        <label class="block text-sm text-gray-600 mb-3">E-posta</label>
                        <input type="email" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="ornek@email.com">
                    </div>
                    
                    <div>
                        <div class="flex justify-between mb-3">
                            <label class="block text-sm text-gray-600">Şifre</label>
                            <a href="#" class="text-sm text-gray-400 hover:text-gray-900">Unuttum</a>
                        </div>
                        <input type="password" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="••••••••">
                    </div>
                    
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 border-gray-300 rounded text-gray-900 focus:ring-0">
                        <label for="remember" class="ml-3 text-sm text-gray-600">Beni hatırla</label>
                    </div>
                    
                    <button type="submit" class="w-full py-4 bg-gray-900 text-white hover:bg-gray-800">
                        Giriş Yap
                    </button>
                </form>
                
                <div class="mt-8 text-center">
                    <span class="text-gray-500">Hesabınız yok mu?</span>
                    <a href="register_minimal.html" class="text-gray-900 ml-2 hover:underline">Kayıt Ol</a>
                </div>
            </div>
        </div>
        
        <!-- Right Side - Image/Info -->
        <div class="hidden lg:flex lg:w-1/2 bg-gray-50 items-center justify-center p-12">
            <div class="max-w-md text-center">
                <div class="text-6xl font-light text-gray-900 mb-8">👨‍⚖️</div>
                <h2 class="text-3xl font-light text-gray-900 mb-4">Hoş Geldiniz</h2>
                <p class="text-gray-600 leading-relaxed">
                    Türkiye'nin en güvenilir avukat tevkil platformuna giriş yapın ve 
                    işlerinizi kolayca yönetin.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
