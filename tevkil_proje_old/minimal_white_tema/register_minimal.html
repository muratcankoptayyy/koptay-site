<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Tevkil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body class="bg-white">
    
    <div class="min-h-screen flex">
        <!-- Left Side - Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-12">
            <div class="w-full max-w-md">
                <div class="mb-16">
                    <a href="index_minimal.html" class="text-2xl font-light text-gray-900">Tevkil</a>
                </div>
                
                <h1 class="text-4xl font-light text-gray-900 mb-3">Kayıt Ol</h1>
                <p class="text-gray-500 mb-12">Ücretsiz hesap oluşturun</p>
                
                <form class="space-y-8">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm text-gray-600 mb-3">Ad</label>
                            <input type="text" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="Murat Can">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-3">Soyad</label>
                            <input type="text" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="Koptay">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-600 mb-3">E-posta</label>
                        <input type="email" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="ornek@email.com">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-600 mb-3">Telefon</label>
                        <input type="tel" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="+90 555 123 45 67">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-600 mb-3">Baro Sicil No</label>
                        <input type="text" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="İstanbul/12345">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-600 mb-3">Şifre</label>
                        <input type="password" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="••••••••">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-600 mb-3">Şifre (Tekrar)</label>
                        <input type="password" class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:border-gray-900 focus:ring-0 bg-transparent" placeholder="••••••••">
                    </div>
                    
                    <div class="flex items-start">
                        <input type="checkbox" id="terms" class="w-4 h-4 border-gray-300 rounded text-gray-900 focus:ring-0 mt-1">
                        <label for="terms" class="ml-3 text-sm text-gray-600">
                            <a href="#" class="text-gray-900 hover:underline">Kullanım koşullarını</a> ve 
                            <a href="#" class="text-gray-900 hover:underline">gizlilik politikasını</a> kabul ediyorum
                        </label>
                    </div>
                    
                    <button type="submit" class="w-full py-4 bg-gray-900 text-white hover:bg-gray-800">
                        Kayıt Ol
                    </button>
                </form>
                
                <div class="mt-8 text-center">
                    <span class="text-gray-500">Zaten hesabınız var mı?</span>
                    <a href="login_minimal.html" class="text-gray-900 ml-2 hover:underline">Giriş Yap</a>
                </div>
            </div>
        </div>
        
        <!-- Right Side - Image/Info -->
        <div class="hidden lg:flex lg:w-1/2 bg-gray-50 items-center justify-center p-12">
            <div class="max-w-md">
                <div class="text-6xl font-light text-gray-900 mb-8">⚖️</div>
                <h2 class="text-3xl font-light text-gray-900 mb-6">Platforma Katılın</h2>
                <div class="space-y-6 text-gray-600">
                    <div class="flex items-start gap-4">
                        <div class="text-2xl">✓</div>
                        <div>
                            <div class="font-medium text-gray-900 mb-1">Tamamen Ücretsiz</div>
                            <div class="text-sm">Hiçbir ücret ödemeden tüm özelliklere erişin</div>
                        </div>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="text-2xl">✓</div>
                        <div>
                            <div class="font-medium text-gray-900 mb-1">Güvenli Platform</div>
                            <div class="text-sm">Sadece doğrulanmış avukatlar</div>
                        </div>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="text-2xl">✓</div>
                        <div>
                            <div class="font-medium text-gray-900 mb-1">Hızlı Başlangıç</div>
                            <div class="text-sm">Dakikalar içinde ilan oluşturun</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
