<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tevkil">
    <meta name="theme-color" content="#1a56db">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
    
    <title>{% block title %}Tevkil - Avukat İş Devri Platformu{% endblock %}</title>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <!-- PWA Install Prompt -->
    <div id="pwa-install-prompt" style="display: none; position: fixed; bottom: 20px; left: 20px; right: 20px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 9999;">
        <h3>📱 Tevkil'i Telefonunuza Yükleyin</h3>
        <p>Ana ekranınıza ekleyerek daha hızlı erişin!</p>
        <button id="pwa-install-btn" style="padding: 10px 20px; background: #1a56db; color: white; border: none; border-radius: 5px; cursor: pointer;">Yükle</button>
        <button id="pwa-dismiss-btn" style="padding: 10px 20px; background: #gray; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">Sonra</button>
    </div>
    
    <!-- PWA Service Worker Registration -->
    <script>
        // Service Worker kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker kaydedildi:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ Service Worker kaydı başarısız:', error);
                    });
            });
        }
        
        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Prompt'u göster
            document.getElementById('pwa-install-prompt').style.display = 'block';
        });
        
        document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`PWA install ${outcome}`);
                deferredPrompt = null;
                document.getElementById('pwa-install-prompt').style.display = 'none';
            }
        });
        
        document.getElementById('pwa-dismiss-btn')?.addEventListener('click', () => {
            document.getElementById('pwa-install-prompt').style.display = 'none';
        });
        
        // Push Notification izni iste
        async function requestNotificationPermission() {
            if ('Notification' in window && navigator.serviceWorker) {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    console.log('✅ Bildirim izni verildi');
                }
            }
        }
        
        // Kullanıcı login olduktan sonra çağır
        // requestNotificationPermission();
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
