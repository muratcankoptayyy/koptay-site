<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı - Tevkil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="text-center max-w-md mx-auto">
        <div class="bg-white -2xl shadow-2xl p-8 md:p-12">
            <!-- Offline Icon -->
            <div class="mb-6">
                <span class="material-symbols-outlined text-gray-400" style="font-size: 96px;">
                    cloud_off
                </span>
            </div>

            <!-- Title -->
            <h1 class="text-3xl font-bold text-gray-900 mb-4">
                İnternet Bağlantısı Yok
            </h1>

            <!-- Description -->
            <p class="text-gray-600 mb-8">
                Şu anda çevrimdışısınız. İnternet bağlantınızı kontrol edin ve tekrar deneyin.
            </p>

            <!-- Retry Button -->
            <button 
                onclick="location.reload()" 
                class="w-full bg-gray-900 hover:bg-gray-900 text-white font-semibold py-4 px-6 transition-colors duration-200 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">refresh</span>
                Tekrar Dene
            </button>

            <!-- Cached Content Info -->
            <div class="mt-8 p-4 bg-blue-50">
                <p class="text-sm text-blue-800">
                    💡 <strong>İpucu:</strong> Bazı sayfalar çevrimdışı kullanılabilir. Son ziyaret ettiğiniz sayfaları görüntüleyebilirsiniz.
                </p>
            </div>

            <!-- Back to Home -->
            <div class="mt-6">
                <a href="/" class="text-gray-900 hover:text-blue-700 font-medium text-sm">
                    ← Ana sayfaya dön
                </a>
            </div>
        </div>

        <!-- Connection Status -->
        <div class="mt-6 text-white">
            <p class="text-sm opacity-90">
                Bağlantı durumu: <span id="connection-status" class="font-semibold">Çevrimdışı</span>
            </p>
        </div>
    </div>

    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', () => {
            document.getElementById('connection-status').textContent = 'Çevrimiçi';
            setTimeout(() => {
                location.reload();
            }, 1000);
        });

        window.addEventListener('offline', () => {
            document.getElementById('connection-status').textContent = 'Çevrimdışı';
        });

        // Check connection status
        if (navigator.onLine) {
            document.getElementById('connection-status').textContent = 'Çevrimiçi';
        }
    </script>
</body>
</html>
