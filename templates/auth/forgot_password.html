{% extends 'layouts/base.html' %}

{% block title %}Şifremi Unuttum - {{ config.SITE_NAME or 'UTAP' }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Şifre Sıfırlama
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                E-posta adresinizi veya telefon numaranızı girin, size şifre sıfırlama bağlantısı veya kodu gönderelim.
            </p>
        </div>
        <form class="mt-8 space-y-6" action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="contact" class="sr-only">E-posta veya Telefon</label>
                    <input id="contact" name="contact" type="text" required class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm" placeholder="E-posta adresi veya Telefon (5XX...)">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                    Sıfırlama Kodu Gönder
                </button>
            </div>
            
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="font-medium text-primary hover:text-primary-dark">
                    Giriş sayfasına dön
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
