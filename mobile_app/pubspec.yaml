name: utap_mobile
description: UTAP - Ulusal Tevkil Ağı Projesi Mobil Uygulama
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Animations
  shimmer: ^3.0.0
  
  # Date & Time
  intl: ^0.18.1
  
  # Utilities
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  http_parser: ^4.0.2
  file_picker: ^8.0.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.1
  permission_handler: ^11.0.1
  # record: 5.1.0
  audioplayers: ^5.2.1
  path_provider: ^2.1.1
  # flutter_local_notifications: ^19.0.0  # Temporarily disabled for Android build
  
  # Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
  
  # Fonts
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#30696C"
  adaptive_icon_foreground: "assets/images/icon-foreground.png"

flutter_native_splash:
  color: "#30696C"
  image: "assets/images/splash.png"
  android_12:
    image: "assets/images/splash.png"
    icon_background_color: "#30696C"
    color: "#30696C"
  ios: true
  fullscreen: true
